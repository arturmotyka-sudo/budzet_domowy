<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f6f5e">
<title>Budżet domowy</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="coin-192.png">
<link rel="apple-touch-icon" href="coin-192.png">
<style>
:root{--bg:#f3f4f1;--card:#fff;--ink:#1d2321;--mute:#6b7470;--line:#e3e6e1;--acc:#2f6f5e;--onacc:#fff;--acc2:#e6efeb;--warn:#a5680f;--warnbg:#fbf0dc;--bad:#c62828;--badbg:#fbeaea;--ok:#2f6f5e}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111413;--card:#1a1e1d;--ink:#e8ece9;--mute:#97a19c;--line:#2a302e;--acc:#6cc2a6;--onacc:#0d1f19;--acc2:#1e2c27;--warn:#e3ab4f;--warnbg:#2e2617;--bad:#ef6b6b;--badbg:#3a1d1f;--ok:#6cc2a6}}
:root[data-theme=dark]{--bg:#111413;--card:#1a1e1d;--ink:#e8ece9;--mute:#97a19c;--line:#2a302e;--acc:#6cc2a6;--onacc:#0d1f19;--acc2:#1e2c27;--warn:#e3ab4f;--warnbg:#2e2617;--bad:#ef6b6b;--badbg:#3a1d1f;--ok:#6cc2a6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 14px 4px;display:flex;align-items:center;justify-content:center;position:relative}
.mnav{display:flex;align-items:center;gap:6px}
.mnav button{border:0;background:var(--card);width:38px;height:38px;border-radius:50%;font-size:22px;line-height:1;border:1px solid var(--line)}
.mnav .lbl{font-weight:650;font-size:17px;min-width:160px;text-align:center;background:none;border:0;width:auto;height:auto}
.htitle{font-weight:650;font-size:17px;padding:8px 0}
.mode{position:absolute;right:14px;top:50%;transform:translateY(-30%);font-size:11px;color:var(--mute)}
main{padding:2px 14px 130px;max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:14px 16px;margin:10px 0;border:1px solid var(--line)}
.card.list{padding:2px 14px}
.center{text-align:center}
.hero .k{color:var(--mute);font-size:13px}
.hero .big{font-size:34px;font-weight:700;letter-spacing:-.5px;margin:2px 0 6px;font-variant-numeric:tabular-nums}
.hero.ok .big{color:var(--ok)}.hero.warn .big{color:var(--warn)}.hero.bad .big{color:var(--bad)}
.status{font-size:13px;font-weight:600;padding:4px 0 0;display:block}
.ok .status{color:var(--ok)}.warn .status{color:var(--warn)}.bad .status{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.stats div{font-size:11px;color:var(--mute)}.stats b{display:block;font-size:13px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.wallets{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.wallet{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px}
.wallet b{font-size:18px;font-variant-numeric:tabular-nums}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:20px 4px 6px;display:flex;justify-content:space-between;font-weight:600}
h3 span{text-transform:none;letter-spacing:0}
.cat{display:flex;gap:12px;align-items:center;padding:12px 0;border:0;border-bottom:1px solid var(--line);width:100%;background:none;text-align:left}
.cat:last-child{border-bottom:0}
.emo{width:40px;height:40px;border-radius:12px;background:var(--acc2);display:grid;place-items:center;font-size:20px;flex:none}
.cbody{flex:1;min-width:0;display:block}
.crow{display:flex;justify-content:space-between;gap:8px}
.cname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cleft{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{display:block;height:6px;background:var(--line);border-radius:3px;margin:6px 0 4px;overflow:hidden}
.bar{display:flex}
.bar i{display:block;height:100%;background:var(--acc);border-radius:3px}
.bar i.pl{background:repeating-linear-gradient(45deg,var(--bad) 0 4px,transparent 4px 7px);opacity:.75;border-radius:0 3px 3px 0}
.bar.bad i{background:var(--bad)}
.sub{font-size:12px;color:var(--mute);display:block}
.neg{color:var(--bad)}.pos{color:var(--ok)}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.banner{border-radius:12px;padding:10px 12px;font-size:13px;margin:8px 0}
.banner.warn{background:var(--warnbg);color:var(--warn)}.banner.bad{background:var(--badbg);color:var(--bad)}
.fab{position:fixed;right:18px;bottom:86px;width:60px;height:60px;border-radius:50%;background:var(--acc);color:var(--onacc);border:0;font-size:32px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.22);z-index:6}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;color:var(--mute);padding:8px 0 12px;font-size:12px}
nav.tabs button.on{color:var(--acc);font-weight:650}
nav.tabs .ico{display:block;font-size:20px;margin-bottom:1px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:20;display:none;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom));animation:up .18s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.shead h2{font-size:18px;margin:0}
.x{border:0;background:var(--bg);width:34px;height:34px;border-radius:50%;font-size:15px;flex:none}
label.f{display:block;font-size:12px;color:var(--mute);margin:14px 0 6px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px}
input.amt{font-size:30px;font-weight:700;text-align:center;padding:12px;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:9px 4px;border-radius:10px;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 12px;font-size:14px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.chip small{opacity:.75;margin-left:4px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-weight:650;background:var(--acc);color:var(--onacc);margin-top:14px}
.btn.sec{background:var(--acc2);color:var(--acc)}
.btn.danger{background:var(--badbg);color:var(--bad)}
.btn:disabled{opacity:.45}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2 .btn{margin-top:10px}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.kv:last-child{border-bottom:0}
.tx{display:flex;gap:12px;align-items:center;padding:10px 0;border:0;border-bottom:1px solid var(--line);width:100%;background:none;text-align:left}
.tx:last-child{border-bottom:0}
.tx .emo{width:36px;height:36px;font-size:17px}
.tx .amtv{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.dhead{display:flex;align-items:center;gap:10px;margin:22px 2px 6px;color:var(--acc);font-size:13px;font-weight:700;letter-spacing:.02em}
.dhead::before,.dhead::after{content:'';flex:1;height:2px;background:var(--acc);opacity:.35;border-radius:1px}
.dhead::before{flex:0 0 14px}
:root{--c-acc:#2f6f5e;--c-stat:#2a78d6;--c-inc:#1baf7a;--c-pay:#c62828;--c-lim:#6250d6}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--c-acc:#6cc2a6;--c-stat:#3987e5;--c-inc:#199e70;--c-pay:#ef6b6b;--c-lim:#9085e9}}
:root[data-theme=dark]{--c-acc:#6cc2a6;--c-stat:#3987e5;--c-inc:#199e70;--c-pay:#ef6b6b;--c-lim:#9085e9}
.aalert{display:block;width:100%;text-align:left;font-size:14px;line-height:1.4;border-color:var(--warn);background:var(--warnbg);color:var(--ink)}
.aalert.late{border-color:var(--bad);background:var(--badbg)}
.sep{display:flex;align-items:center;gap:10px;margin:22px 2px 6px;color:var(--sc);font-size:13px;font-weight:700;letter-spacing:.02em}
.sep::before{content:'';flex:0 0 14px;height:2px;background:var(--sc);opacity:.6;border-radius:1px}
.sep i{flex:1;min-width:12px;height:2px;background:var(--sc);opacity:.6;border-radius:1px}
.sep .sr{color:var(--ink);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.sbar{display:flex;gap:2px;height:14px;margin:2px 0 10px}
.sbar i{display:block;min-width:3px;border-radius:4px}
.leg{display:grid;gap:2px}
.lrow{display:grid;grid-template-columns:14px 1fr auto 42px;gap:8px;align-items:center;font-size:14px;padding:3px 0;font-variant-numeric:tabular-nums}
.lrow .sub{text-align:right}
.lrow:first-child{border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:2px}
.swc{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px}
.swc.inc{height:3px;vertical-align:3px;background:var(--c-inc)}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 32% 6.6em;gap:8px;align-items:center;font-size:13px;padding:3px 0;font-variant-numeric:tabular-nums}
.trow>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow b{font-weight:600;white-space:nowrap;text-align:right}.trow small{color:var(--mute);font-weight:400;font-size:11px}
.tbar{position:relative;height:8px;background:var(--line);border-radius:4px}
.tbar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.tbar em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5;margin-left:-1px}
.cols{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.col{position:relative;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-end;height:110px;gap:4px;min-width:0}
.col .stk{display:flex;flex-direction:column-reverse;gap:2px;border-radius:4px 4px 0 0;overflow:hidden;min-height:0;border-bottom:1px solid var(--mute)}
.col .stk i{display:block;min-height:2px}
.col .incm{position:absolute;left:10%;right:10%;height:3px;border-radius:2px;background:var(--c-inc)}
.col .ml{font-size:10px;color:var(--mute);text-align:center;white-space:nowrap;overflow:hidden;height:14px}
.col.dim .stk{opacity:.35}
.col.on .ml{color:var(--ink);font-weight:700}
.srow{display:grid;grid-template-columns:54px 1fr 40px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.srow:last-of-type{border-bottom:0}
.srow.w{grid-template-columns:1fr 40px}
.srow .line2{grid-column:2/4;display:grid;grid-template-columns:1fr 40px 40px;gap:6px}
.srow input.emoin{text-align:center;font-size:20px;padding:8px 4px}
.ib.emobtn{font-size:22px;height:46px}
.epick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:6px}
.epick button{font-size:24px;height:48px;border:1px solid var(--line);background:var(--bg);border-radius:12px}
.epick button.on{border-color:var(--acc);background:var(--acc2)}
.ib{border:1px solid var(--line);background:var(--bg);border-radius:10px;height:42px;font-size:15px}
.ib.del{color:var(--bad)}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0}
.chk input{width:20px;height:20px;flex:none}
.dlgwrap{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:none;align-items:center;justify-content:center;padding:20px}
.dlgwrap.open{display:flex}
.dlg{background:var(--card);border-radius:18px;padding:18px;max-width:380px;width:100%}
.dlg p{margin:0 0 6px}
.dlg{max-height:85vh;overflow:auto}
.sw-wrap{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.sw-wrap:last-child{border-bottom:0}
.sw-wrap .plrow,.sw-wrap .cat{border-bottom:0}
.sw-del{position:absolute;top:0;right:0;bottom:0;width:88px;display:flex}
.sw-del button{flex:1;border:0;background:var(--bad);color:#fff;font-size:13px;font-weight:600;line-height:1.3}
.sw-row{position:relative;background:var(--card);transition:transform .18s ease}
.card.list{overflow:hidden}
.toast{position:fixed;left:50%;bottom:160px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.toast.act{pointer-events:auto}
@keyframes msl{from{opacity:.3;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes msr{from{opacity:.3;transform:translateX(-40px)}to{opacity:1;transform:none}}
#main.mslide-l{animation:msl .22s ease-out}#main.mslide-r{animation:msr .22s ease-out}
.toast button{margin-left:12px;border:0;background:none;color:inherit;font:inherit;font-weight:700;text-decoration:underline;padding:4px 2px}
.sw-mov{position:absolute;top:0;left:0;bottom:0;width:88px;display:flex}
.sw-mov button{flex:1;border:0;background:#3b6fb6;color:#fff;font-size:13px;font-weight:600;line-height:1.3}
textarea{width:100%;height:160px;font:12px/1.3 ui-monospace,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px}
p.sub{margin:6px 0}

.banner.info{background:var(--acc2);color:var(--acc)}
.banner button{border:0;background:none;color:inherit;font-weight:650;text-decoration:underline;padding:0;margin-left:4px}
.hidden{display:none!important}
:root{--orange:#e07b00}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--orange:#f59e0b}}
:root[data-theme=dark]{--orange:#f59e0b}
.b-low{color:var(--bad)!important}.b-mid{color:var(--orange)!important}.b-ok{color:var(--vivid)!important}
.wallet{border-left-width:5px}
.wallet.b-low-w{border-left-color:var(--bad)}.wallet.b-mid-w{border-left-color:var(--orange)}.wallet.b-ok-w{border-left-color:var(--vivid)}
:root{--vivid:#16a34a;--vividbg:#dcfce7}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--vivid:#22c55e;--vividbg:#12301f}}
:root[data-theme=dark]{--vivid:#22c55e;--vividbg:#12301f}
.hero.ok .big,.hero.warn .big,.hero.ok .k,.hero.warn .k{color:var(--vivid)}
.hero .k{font-weight:600;font-size:14px}
.hero.bad .k{color:var(--bad)}
.hero.warn .status{color:var(--vivid)}
nav.tabs button{position:relative}
nav.tabs button.upd::after{content:'';position:absolute;top:4px;left:calc(50% + 8px);width:12px;height:12px;border-radius:50%;background:var(--bad);border:2px solid var(--card)}
.ubadge{margin-left:auto;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.ubadge.new{background:var(--bad);color:#fff}
.ubadge.ok{background:var(--acc2);color:var(--ok)}
.ubadge.chk{background:var(--line);color:var(--mute)}
.hint.center{text-align:center}
.hbtn{position:absolute;right:14px;top:50%;transform:translateY(-35%);border:1px solid var(--line);background:var(--card);width:38px;height:38px;border-radius:50%;font-size:17px;line-height:1}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:6px;background:var(--badbg);color:var(--bad);margin-left:6px;vertical-align:1px}
.tag.g{background:var(--acc2);color:var(--ok)}
.tag.n{background:var(--bg);color:var(--mute)}
.plrow{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.plrow:last-child{border-bottom:0}
.plrow .tx{border-bottom:0;flex:1;min-width:0}
.plrow .cname{white-space:normal;overflow:visible}
.paybtn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-size:13px;white-space:nowrap;flex:none}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:14px;background:var(--bg);width:100%;text-align:left}
.toggle .sub{margin-top:2px}
.toggle.on{border-color:var(--bad);background:var(--badbg)}
.toggle.on.g{border-color:var(--ok);background:var(--acc2)}
.sw{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.toggle.on .sw{background:var(--bad)}.toggle.on.g .sw{background:var(--ok)}
.toggle.on .sw::after{left:21px}
.hint{font-size:12px;color:var(--mute);margin-top:6px;display:block}
.dlg .btn{margin-top:8px}
.rrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.rrow:last-of-type{border-bottom:0}
.rrow .cbody{flex:1}
/* PIN */
.lock{position:fixed;inset:0;z-index:28;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.lockbox{width:100%;max-width:310px;text-align:center}
.lockbox img{width:76px;height:76px}
.lockbox h2{margin:10px 0 4px;font-size:20px}
.dots{display:flex;gap:14px;justify-content:center;margin:18px 0 6px;min-height:18px}
.dots i{width:15px;height:15px;border-radius:50%;border:2px solid var(--acc)}
.dots i.f{background:var(--acc)}
.lockmsg{min-height:20px;font-size:13px;color:var(--bad)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.pad button{height:68px;border-radius:18px;font-size:26px;background:var(--card);border:1px solid var(--line);touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform .06s,background .06s}
.pad button.pr,.pad button:active{transform:scale(.93);background:var(--acc2)}
.pad button.ok.pr,.pad button.ok:active{background:var(--acc)}
button,input,select,a{touch-action:manipulation}
.lockmsg.info{color:var(--mute)}
.pad button.ok{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.pad button.inv{visibility:hidden}
.linkbtn{border:0;background:none;color:var(--mute);margin-top:18px;text-decoration:underline;font-size:13px}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
details.help{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:8px 0;padding:0 14px}
details.help summary{padding:14px 0;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.help summary::-webkit-details-marker{display:none}
details.help summary::after{content:'›';font-size:22px;color:var(--mute);transform:rotate(90deg);transition:transform .15s;line-height:1}
details.help[open] summary::after{transform:rotate(-90deg)}
details.help p,details.help ol,details.help ul{font-size:14px;margin:0 0 12px;padding-left:0}
details.help ol,details.help ul{padding-left:20px}
details.help li{margin:4px 0}
.legend{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;font-size:14px;align-items:center}
body.locked header,body.locked main,body.locked nav,body.locked #fab{visibility:hidden}
</style>
</head>
<body class="locked">
<header id="hdr"></header>
<main id="main"><div class="empty">Wczytywanie…</div></main>

/* ---------- storage (tylko w telefonie) ---------- */
function LocalStore(initial, persist) {
  const KEY = 'budzet-domowy-v1';
  const norm = d => ({settings:d.settings || null, months:d.months || {}, tx:d.tx || {}, rules:d.rules || {}, assets:d.assets || {}});
  let data = norm({});
  if (initial) data = norm(clone(initial));
  else { try { const r = lsGet(KEY); if (r) data = norm(JSON.parse(r)); } catch (e) {} }
  const subs = new Set();
  let muted = false, dirty = false;
  const save = () => {
    if (muted) { dirty = true; return; }
    if (persist) { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { toast('Nie udało się zapisać w pamięci telefonu!'); throw e; } }
    subs.forEach(f => f());
  };
  const watch = f => { subs.add(f); f(); return () => subs.delete(f); };
  const txOf = m => Object.values(data.tx).filter(t => t.m === m);
  return {
    watchAll: cb => watch(() => cb(data)),
    batch: async fn => { muted = true; try { await fn(); } finally { muted = false; if (dirty) { dirty = false; save(); } } },
    allTx: () => Object.values(data.tx),
    watchSettings: cb => watch(() => cb(data.settings)),
    watchMonth: (m, cb) => watch(() => cb(data.months[m] || null)),
    watchTx: (m, cb) => watch(() => cb(txOf(m))),
    watchRules: cb => watch(() => cb(data.rules)),
    getMonth: async m => data.months[m] || null,
    getTx: async m => txOf(m),
    listMonths: async () => Object.keys(data.months),
    getAll: () => clone(data),
    replaceAll: async d => { data = norm(d); save(); },
    saveSettings: async s => { data.settings = s; save(); },
    saveMonth: async (m, d) => { data.months[m] = d; save(); },
    saveTx: async t => { data.tx[t.id] = t; save(); },
    deleteTx: async id => { delete data.tx[id]; save(); },
    saveRule: async r => { data.rules[r.id] = r; save(); },
    deleteRule: async id => { delete data.rules[id]; save(); },
    saveAsset: async a => { data.assets[a.id] = a; save(); },
    deleteAsset: async id => { delete data.assets[id]; save(); },
    clearMonth: async (m, whole) => {
      let n = 0;
      for (const [id, t] of Object.entries(data.tx)) if (t.m === m) { delete data.tx[id]; n++; }
      if (whole) delete data.months[m];
      save(); return n;
    },
    hasData: () => Object.keys(data.tx).length > 0 || Object.keys(data.months).length > 0 || Object.keys(data.assets).length > 0
  };
}

    S.txBy = by; subMonth(); render();
  });
}

/* ---------- płatności cykliczne / przypomnienia ---------- */
function ruleApplies(r, m) {
  if (r.freq === 'once') return r.target === m;
  if (m <= r.from) return false;
  if (r.freq === 'm') return monthDiff(r.from, m) % (r.every || 1) === 0;
  if (r.freq === 'y') return m.slice(5) === r.from.slice(5);
  return false;
}
function txFromRule(r, m) {
  const t = {id:uid(), m, d:clampDay(m, r.day), type:r.type, amount:r.amount, wallet:r.wallet, note:r.note || '', planned:true, ts:Date.now(), gen:true};
  if (r.freq !== 'once') t.rule = r.id;
  if (r.type === 'wydatek') t.cat = r.cat;
  if (r.type === 'przelew') t.to = r.to;
  return t;
}
async function applyRules(m, rules, lyTx) {
  const existing = await store.getTx(m); let n = 0;
  for (const r of rules) {
    if (!ruleApplies(r, m)) continue;
    if (r.freq !== 'once' && existing.some(t => t.rule === r.id)) continue;
    const t = txFromRule(r, m);
    // korekta „tylko w tym miesiącu” sprzed roku przechodzi na ten sam miesiąc w kolejnym roku
    const ov = (lyTx || []).find(x => x.rule === r.id && x.override);
    if (ov) {
      Object.assign(t, {type:ov.type, amount:ov.amount, wallet:ov.wallet, note:ov.note || '', d:clampDay(m, Number(ov.d.slice(8))), override:true});
      delete t.cat; delete t.to; if (ov.type === 'wydatek') t.cat = ov.cat; if (ov.type === 'przelew') t.to = ov.to;
    }
    await store.saveTx(t); n++;
    if (r.freq === 'once') await store.deleteRule(r.id);
  }
  return n;
}
async function applyRuleToExisting(r) {
  const added = [];
  for (const m of (await store.listMonths()).sort()) if (ruleApplies(r, m) && await applyRules(m, [r])) added.push(m);
  return added;
}

  const ensC = id => C[id] || (C[id] = {plan:0, spent:0, planned:0, orphan:true});
  st.wallets.forEach(w => W[w.id] = {start:0, inc:0, spent:0, tin:0, tout:0, bal:0, pin:0, pout:0, actual:0, pinc:0, pexp:0, ptin:0, ptout:0});
  st.categories.forEach(c => C[c.id] = {plan:0, spent:0, planned:0});

  for (const [k, v] of Object.entries(md.plan || {})) ensC(k).plan += v;

async function assetAction(a) {
  const d = S.adraft;
  if (a === 'akind') return;
  if (a === 'asave') {
    syncAsset();
    const amount = parseZl(d.amountStr !== undefined ? d.amountStr : toInput(d.amount || 0));
    if (isNaN(amount) || amount < 0) { toast('Wpisz poprawną kwotę'); return; }
    const rate = d.rateStr ? Number(String(d.rateStr).replace(',', '.')) : 0;
    if (isNaN(rate) || rate < 0) { toast('Wpisz poprawne oprocentowanie'); return; }
    if (d.start && d.end && d.end < d.start) { toast('Koniec musi być po początku'); return; }
    const old = d.id && S.assets[d.id];
    const rec = {id:d.id || uid(), kind:d.kind, name:(d.name || '').trim(), inst:(d.inst || '').trim(), amount, rate:rate || 0, start:d.start || '', end:d.end || '', remind:d.remind ?? 14, note:(d.note || '').trim(), upd:(!old || old.amount !== amount) ? Date.now() : (old.upd || Date.now())};
    closeSheet(); S.adraft = null;
    await write(store.saveAsset(rec), old ? 'Zapisano' : 'Dodano');
    return;
  }
  if (a === 'arenew') {
    syncAsset();
    const cur = S.assets[d.id]; if (!cur || !cur.end) return;
    const len = cur.start ? Math.max(1, Math.round((Date.parse(cur.end) - Date.parse(cur.start)) / 864e5)) : 0;
    if (!len) { toast('Wpisz datę „Od”, żeby wiedzieć, na ile odnowić'); return; }
    const int = assetInterest(cur);
    const opts = int ? [{label:`Z odsetkami: ${zl(cur.amount)} → ${zl(cur.amount + int)}`}, {label:`Bez odsetek (${zl(cur.amount)})`}] : [{label:`Odnów od ${fmtDate(cur.end)} na ${daysWord(len)}`}];
    const ch = await choose(`Odnowić „${cur.name || akind(cur.kind)[2]}” od ${fmtDate(cur.end)} do ${fmtDate(addDays(cur.end, len))}?`, opts);
    if (ch < 0) return;
    const n = Object.assign({}, cur, {start:cur.end, end:addDays(cur.end, len), amount:cur.amount + (int && ch === 0 ? int : 0), upd:Date.now()});
    closeSheet(); S.adraft = null;
    await write(store.saveAsset(n), `Odnowiono do ${fmtDate(n.end)}`);
    return;
  }
  if (a === 'adel') {
    const cur = S.assets[d.id]; if (!cur) return;
    if (!(await ask(`Usunąć „${cur.name || akind(cur.kind)[2]}” (${zl(cur.amount || 0)})?`))) return;
    closeSheet(); S.adraft = null;
    await write(store.deleteAsset(cur.id), 'Usunięto');
  }
}

function catRow(x, cc) {
  const real = cc.spent - cc.planned;              // naprawdę zapłacone
  const left = cc.plan - cc.spent;                 // wolne = plan − zapłacone − zaplanowane
  const base = Math.max(cc.plan, cc.spent) || 1;
  const pReal = cc.plan > 0 || cc.spent > 0 ? Math.min(100, real / base * 100) : 0;
  const pPlan = cc.plan > 0 || cc.spent > 0 ? Math.min(100 - pReal, cc.planned / base * 100) : 0;
  let right, sub, bc = '';

  const pl = cc.planned ? ` · <span class="neg">🕒 zaplanowane ${zl(cc.planned)}</span>` : '';
  const verb = x.group === 'oszczednosci' ? 'odłożone' : x.group === 'stale' ? 'zapłacone' : 'wydane';
  if (cc.auto) {
    if (cc.planned) { right = `<span class="neg">🕒 do zapłaty ${zl(cc.planned)}</span>`; sub = `plan z pozycji ${zl(cc.plan)} · ${verb} ${zl(real)}`; }
    else { right = `<span class="pos">✓ ${zl(real)}</span>`; sub = `plan z pozycji · ${verb} ${zl(real)}`; }
    return `<button class="cat" data-act="cat" data-id="${esc(x.id)}"><span class="emo">${esc(x.emoji || '•')}</span><span class="cbody"><span class="crow"><span class="cname">${esc(x.name)}</span><span class="cleft">${right}</span></span><span class="bar"><i style="width:${pReal.toFixed(1)}%"></i><i class="pl" style="width:${pPlan.toFixed(1)}%"></i></span><span class="sub">${sub}</span></span></button>`;
  }
  if (left < 0 && !cc.plan) { right = `<span class="neg">−${zl(-left)}</span>`; sub = REPORT ? 'brak planu' : `<span class="neg">brak planu – stuknij, by ustawić</span>${real ? ` · ${verb} ${zl(real)}` : ''}`; bc = 'bad'; }
  else if (left < 0) { right = `<span class="neg">−${zl(-left)}</span>`; sub = `ponad plan o ${zl(-left)} · ${verb} ${zl(real)} z ${zl(cc.plan)}`; bc = 'bad'; }
  else if (x.group === 'stale' && cc.plan > 0 && left === 0 && !cc.planned) { right = `<span class="pos">✓ opłacone</span>`; sub = `zapłacono ${zl(real)}`; }
  else if (left === 0 && cc.planned) { right = `<span class="neg">🕒 do zapłaty</span>`; sub = `${verb} ${zl(real)} z ${zl(cc.plan)}`; }

  return `<button class="cat" data-act="cat" data-id="${esc(x.id)}"><span class="emo">${esc(x.emoji || '•')}</span><span class="cbody"><span class="crow"><span class="cname">${esc(x.name)}</span><span class="cleft">${right}</span></span><span class="bar ${bc}"><i style="width:${pReal.toFixed(1)}%"></i><i class="pl" style="width:${pPlan.toFixed(1)}%"></i></span><span class="sub">${sub}${pl}</span></span></button>`;
}

function historyList() {

    const dl = entryDay(entryTime(t));
    if (dl !== day) { if (day !== null) h += `</div>`; day = dl; h += `<div class="dhead">${esc(dl)}</div><div class="card list">`; }
    const when = new Date(entryTime(t)).toLocaleTimeString('pl-PL', {hour:'2-digit', minute:'2-digit'});
    h += txRow(t, true, false, (t.mt && t.ts && t.mt - t.ts > 60000 ? 'edytowano ' : 'dodano ') + when);
  }
  if (day !== null) h += `</div>`;
  if (auto.length) h += `<div class="dhead">Dodane automatycznie (powtarzające się) · ${auto.length}</div><div class="card list">${auto.map(t => txRow(t, true)).join('')}</div>`;
  return h;
}

  + sec('📤 Raport dla żony i kopia zapasowa', `<ul>

  + (REPORT ? '' : sec('⬇️ Aktualizacja' + (!S.remote ? '<span class="ubadge chk">sprawdzam…</span>' : S.remote.error ? '' : verNewer(S.remote.version, APP_VERSION) ? `<span class="ubadge new">● Nowa wersja ${esc(S.remote.version)}</span>` : '<span class="ubadge ok">✓ aktualna</span>'), `<div class="card" style="margin:0 0 12px">${updateHtml()}</div><p>Gdy jest nowsza wersja, na zakładce Pomoc pojawia się czerwona kropka. Stuknij <b>Aktualizuj</b> – kwoty, ustawienia i PIN zostają bez zmian.</p>`, !!(S.remote && !S.remote.error && verNewer(S.remote.version, APP_VERSION))))
  + `<p class="sub center" style="margin:16px 0">Budżet domowy · wersja ${APP_VERSION}</p>`;
}

function updateHtml() {
  const r = S.remote;
  let info;
  if (!r) info = `<p class="sub">Sprawdzam najnowszą wersję…</p>`;
  else if (r.error) info = `<p class="sub">Nie udało się sprawdzić – brak internetu?</p><button class="btn sec" data-act="updcheck">🔄 Sprawdź ponownie</button>`;
  else if (verNewer(r.version, APP_VERSION)) info = `<div class="kv"><span>Najnowsza</span><b class="pos">${esc(r.version)} (${esc(fmtDate(r.date))})</b></div>
      ${(r.changes || []).length ? `<p class="sub"><b>Co nowego:</b><br>${r.changes.map(c => '• ' + esc(c)).join('<br>')}</p>` : ''}
      <button class="btn" data-act="update">⬇️ Aktualizuj do ${esc(r.version)}</button><span class="hint">Twoje kwoty i ustawienia zostaną bez zmian.</span>`;
  else info = `<div class="kv"><span>Najnowsza</span><b>${esc(r.version)}</b></div><p class="sub">✓ Masz aktualną wersję.</p><button class="btn sec" data-act="updcheck">🔄 Sprawdź ponownie</button>`;
  return `<div class="kv"><span>Twoja wersja</span><b>${APP_VERSION} (${esc(fmtDate(APP_DATE))})</b></div>${info}`;
}
async function checkUpdate() {
  if (!S.remote || S.remote.error) { S.remote = null; if (S.tab === 'pomoc') renderMain(true); }
  try {
    const res = await fetch('version.json?t=' + Date.now(), {cache:'no-store'});
    if (!res.ok) throw new Error(res.status);
    S.remote = await res.json();
  } catch (e) { S.remote = {error:true}; }
  render(); if (S.tab === 'pomoc') renderMain(true);
}
async function doUpdate() {
  toast('Aktualizuję…');
  try {
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if (reg) await reg.update();
    if (window.caches) await Promise.all((await caches.keys()).map(k => caches.delete(k)));
  } catch (e) {}
  setTimeout(() => location.reload(), 300);
}

/* ---------- sheets & dialogs ---------- */
function openSheet(html, ctx) { S.sheet = ctx || {}; $('#sheet').innerHTML = `<div class="grab"></div>` + html; $('#ov').classList.add('open'); document.body.style.overflow = 'hidden'; }
function closeSheet() { $('#ov').classList.remove('open'); $('#sheet').innerHTML = ''; S.sheet = null; S.txDraft = null; document.body.style.overflow = ''; if (pending) renderMain(); }
$('#ov').addEventListener('click', e => { if (e.target.id === 'ov') closeSheet(); });
const head = t => `<div class="shead"><h2>${t}</h2><button class="x" data-act="close" aria-label="Zamknij">✕</button></div>`;

/* options: [{label, cls}] → resolves index or -1 */
function choose(text, options) {
  return new Promise(res => {
    const d = $('#dlg');
    d.innerHTML = `<div class="dlg"><p>${esc(text)}</p>${options.map((o, i) => `<button class="btn ${o.cls || ''}" data-r="${i}">${esc(o.label)}</button>`).join('')}<button class="btn sec" data-r="-1">Anuluj</button></div>`;
    d.classList.add('open');
    d.onclick = e => { const b = e.target.closest('[data-r]'); if (!b && e.target !== d) return; d.classList.remove('open'); d.onclick = null; res(b ? Number(b.dataset.r) : -1); };
  });
}
const ask = async (text, ok = 'Usuń', danger = true) => (await choose(text, [{label:ok, cls:danger ? 'danger' : ''}])) === 0;
let toastT;
function toast(msg, undo) {
  const t = $('#toast'); t.textContent = msg;
  if (undo) { const b = document.createElement('button'); b.textContent = 'Cofnij'; b.onclick = () => { clearTimeout(toastT); t.classList.remove('show', 'act'); undo(); }; t.append(b); }
  t.classList.toggle('act', !!undo); t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show', 'act'), undo ? 5000 : 2600);
}

function updatePlanHint() {
  const s = S.sheet, el = $('#planhint'); if (!el) return;
  const raw = $('#plan').value.trim();
  const v = parseZl(raw);
  if (isNaN(v)) { el.textContent = 'Niepoprawna kwota'; return; }
  const eff = (!raw || v === 0) ? (s.spent || 0) : v;   // pusty = plan automatyczny z pozycji
  const after = s.baseAssign + s.basePlan - eff;
  el.innerHTML = `Do rozdysponowania po zmianie: <b class="${after === 0 ? 'pos' : after < 0 ? 'neg' : ''}">${zl(after)}</b>`;
}

/* transaction sheet */
function defaultDate() { const t = todayStr(); if (t.slice(0, 7) === S.month) return t; return S.month < CUR ? lastDay(S.month) : S.month + '-01'; }
function openTx(o) {
  o = o || {};
  const wallets = S.settings.wallets;
  const lw = lsGet('budzet-lastWallet');
  const defW = o.wallet || (wallets.find(w => w.id === lw) ? lw : wallets[0]?.id) || null;
  if (o.edit) {
    const r = o.edit.rule && S.rules[o.edit.rule];
    S.txDraft = Object.assign({amountStr:toInput(o.edit.amount), repeat:ruleKey(r)}, clone(o.edit));
  } else {
    S.txDraft = {id:null, type:o.type || 'wydatek', cat:o.cat || null, wallet:defW, to:null, amountStr:'', d:defaultDate(), note:'', planned:false, repeat:'none'};
  }
  if (S.txDraft.type === 'przelew' && !S.txDraft.to) S.txDraft.to = wallets.find(w => w.id !== S.txDraft.wallet)?.id || null;
  renderTxSheet(true);
}
function chipsW(field, sel, exclude) {
  return `<div class="chips">${S.settings.wallets.filter(w => w.id !== exclude).map(w => `<button class="chip${w.id === sel ? ' on' : ''}" data-act="pick" data-f="${field}" data-v="${esc(w.id)}">${esc(w.name)}</button>`).join('')}</div>`;
}
function renderTxSheet(focus) {
  const t = S.txDraft, c = calc();
  const orig = t.id ? S.tx.find(z => z.id === t.id) : null;
  const types = [['wydatek','Wydatek'], ['wplyw','Wpływ'], ['przelew','Przelew']];
  let h = t.id ? `<div class="shead"><h2>Edytuj operację</h2><span style="display:flex;gap:8px"><button class="x" data-act="tdel" aria-label="Usuń" style="color:var(--bad)">🗑</button><button class="x" data-act="close" aria-label="Zamknij">✕</button></span></div>` : head('Nowa operacja');
  h += `<div class="seg">${types.map(([k, l]) => `<button class="${t.type === k ? 'on' : ''}" data-act="ttype" data-v="${k}">${l}</button>`).join('')}</div>`;
  h += `<input class="amt" id="tamt" inputmode="decimal" placeholder="0,00 zł" value="${esc(t.amountStr)}" style="margin-top:12px${t.planned && t.type !== 'wplyw' ? ';color:var(--bad)' : t.type === 'wplyw' ? ';color:var(--ok)' : ''}">`;
  if (t.id) h += adjRow('tamt');
  if (t.type === 'wydatek') {
    h += `<label class="f">Kategoria</label><div class="chips">${S.settings.categories.map(x => {
      const cc = c.C[x.id]; const left = cc.plan - cc.spent + (orig && orig.type === 'wydatek' && orig.cat === x.id ? orig.amount : 0);

/* usuwanie operacji (także powtarzających się) */
async function deleteTxFlow(t) {
  const r = t.rule && S.rules[t.rule];
  const i = txInfo(t), label = `${i.title}${t.note ? ' · ' + t.note : ''} (${zl(t.amount)})`;
  if (r) {
    const ch = await choose(`„${label}” powtarza się ${freqLabel(r)}. Co usunąć?`, [{label:'Tylko tę', cls:'danger'}, {label:'Tę i przyszłe powtórzenia', cls:'danger'}]);
    if (ch < 0) return false;
    if (ch === 1) {
      closeSheet();
      const fut = store.allTx().filter(x => x.rule === r.id && x.m > t.m && x.planned);
      await write(store.batch(async () => { for (const x of fut) await store.deleteTx(x.id); await store.deleteRule(r.id); await store.deleteTx(t.id); }),
        fut.length ? `Usunięto tę i ${fut.length} zaplanowanych w kolejnych miesiącach` : 'Usunięto');
      return true;
    }
  } else {
    const root = t.copyOf || t.id;
    const copies = store.allTx().filter(x => x.id !== t.id && x.gen && x.m > t.m && x.m.slice(5) === t.m.slice(5) &&
      ((x.copyOf && x.copyOf === root) || (x.note === t.note && x.amount === t.amount && x.type === t.type && (x.cat || '') === (t.cat || ''))));
    if (copies.length) {
      const ch = await choose(`Usunąć „${label}”? Ta pozycja jest też w: ${copies.map(x => monthLabel(x.m)).join(', ')}.`, [{label:'Tylko tę', cls:'danger'}, {label:'Tę i w kolejnych latach', cls:'danger'}]);
      if (ch < 0) return false;
      closeSheet();
      await write(store.batch(async () => { await store.deleteTx(t.id); if (ch === 1) for (const x of copies) await store.deleteTx(x.id); }), ch === 1 ? `Usunięto tę i ${copies.length} w kolejnych latach` : 'Usunięto');
      return true;
    }
    if (!(await ask(`Usunąć „${label}”?`))) return false;
  }
  closeSheet(); await write(store.deleteTx(t.id), 'Usunięto');
  return true;
}

/* brakuje X zł → zdejmij z zaplanowanej płatności albo z limitu kategorii */
async function coverDeficit() {
  const c = calc(), need = -c.toAssign; if (need <= 0) return;
  const items = [];
  S.tx.filter(t => t.planned && t.type === 'wydatek' && t.amount > need).sort((x, y) => y.amount - x.amount)
    .forEach(t => { const i = txInfo(t); items.push({t, label:`🧾 ${i.title}${t.note ? ' · ' + t.note : ''}: ${zl(t.amount)} → ${zl(t.amount - need)}`}); });
  S.settings.categories.filter(x => { const cc = c.C[x.id]; return cc && cc.manual && cc.manual - cc.spent >= need; })
    .forEach(x => items.push({cat:x.id, label:`🛒 Limit ${x.emoji || ''} ${x.name}: ${zl(c.C[x.id].manual)} → ${zl(c.C[x.id].manual - need)}`}));
  if (!items.length) { toast(`Nie ma zaplanowanej kwoty większej niż ${zl(need)} – zmniejsz plan ręcznie albo dodaj wpływ`); return; }
  const ch = await choose(`Brakuje ${zl(need)}. Z czego zdjąć tę kwotę (tylko w: ${monthLabel(S.month)})?`, items.map(o => ({label:o.label})));
  if (ch < 0) return;
  const o = items[ch], m = S.month;
  if (o.t) {
    const snap = clone(o.t), n = clone(o.t); n.amount -= need; n.mt = Date.now(); if (n.rule) n.override = true;
    if (await write(store.saveTx(n))) toast(`Zdjęto ${zl(need)} – bilans na zero`, () => write(store.saveTx(snap), 'Cofnięto'));
  } else {
    const old = S.data.months[m].plan[o.cat], md = clone(S.data.months[m]); md.plan[o.cat] = old - need;
    if (await write(store.saveMonth(m, md))) toast(`Zdjęto ${zl(need)} z limitu – bilans na zero`, () => { const r = clone(S.data.months[m]); r.plan[o.cat] = old; return write(store.saveMonth(m, r), 'Cofnięto'); });
  }
}

const SWW = 88;
function swClose(except) { document.querySelectorAll('.sw-row.open').forEach(r => { if (r !== except) { r.classList.remove('open'); r.style.transform = ''; r.dataset.pos = '0'; } }); }
document.addEventListener('touchstart', e => {

  SW = {row, x:t.clientX, y:t.clientY, dx:0, dir:null, base:Number(row.dataset.pos || 0), right:!!row.parentElement.querySelector('.sw-mov')};

/* porządkowanie kategorii: przeniesienie albo usunięcie operacji */
async function reassignCategory(fromId, toId) {
  await store.batch(async () => {
    for (const t of store.allTx().filter(x => x.cat === fromId)) { if (toId) await store.saveTx(Object.assign({}, t, {cat:toId})); else await store.deleteTx(t.id); }
    for (const r of Object.values(S.rules).filter(x => x.cat === fromId)) { if (toId) await store.saveRule(Object.assign({}, r, {cat:toId})); else await store.deleteRule(r.id); }
    for (const m of monthKeys()) {
      const md = S.data.months[m]; if (!md.plan || md.plan[fromId] === undefined) continue;
      const n = clone(md); const v = n.plan[fromId]; delete n.plan[fromId];
      if (toId && v) n.plan[toId] = (n.plan[toId] || 0) + v;
      await store.saveMonth(m, n);
    }
    if (S.settings.categories.some(x => x.id === fromId)) { const st = clone(S.settings); st.categories = st.categories.filter(x => x.id !== fromId); await store.saveSettings(st); }
  });
  if (S.draft) S.draft.categories = S.draft.categories.filter(x => x.id !== fromId);
}
async function fixOrphan(id) {
  const used = store.allTx().filter(t => t.cat === id).length, rules = Object.values(S.rules).filter(r => r.cat === id).length;
  if (!used && !rules) {
    if (!(await ask('Ta usunięta kategoria nie ma już operacji – został tylko jej stary plan. Usunąć go?', 'Usuń'))) return;
    await write(reassignCategory(id, null), 'Usunięto'); return;
  }
  const r = await categoryCleanup(id, 'usunięta kategoria');
  if (r !== 'cancel') toast(r.startsWith('moved:') ? `Przeniesiono do „${r.slice(6)}”` : 'Usunięto');
}
async function categoryCleanup(id, name) {
  const used = store.allTx().filter(t => t.cat === id).length, rules = Object.values(S.rules).filter(r => r.cat === id).length;
  if (!used && !rules) return 'none';
  const ch = await choose(`„${name}” ma ${used} ${plural(used, 'operację', 'operacje', 'operacji')}${rules ? ` i ${rules} ${plural(rules, 'powtarzanie', 'powtarzania', 'powtarzań')}` : ''} (we wszystkich miesiącach). Co z nimi zrobić?`,
    [{label:'Przenieś do innej kategorii'}, {label:`Usuń razem z operacjami (${used})`, cls:'danger'}]);
  if (ch < 0) return 'cancel';
  if (ch === 1) { await reassignCategory(id, null); return 'deleted'; }

async function shareOrDownload(blob, name, title) {
  const file = new File([blob], name, {type: blob.type});
  if (navigator.canShare && navigator.share) {
    try { if (navigator.canShare({files:[file]})) { await navigator.share({files:[file], title, text:title}); return 'shared'; } }
    catch (e) { if (e && e.name === 'AbortError') return 'cancel'; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  return 'downloaded';
}
function buildReport() {

/* ---------- PIN ---------- */
const PIN_KEY = 'budzet-pin';
const PIN_OFF = 'budzet-pin-off';
const L = {mode:null, step:0, buf:'', first:'', fails:0, until:0, busy:false, onOk:null, info:''};
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const pinSupported = () => !!(window.crypto && crypto.subtle && window.isSecureContext !== false);
function pinRec() { try { return JSON.parse(lsGet(PIN_KEY) || 'null'); } catch (e) { return null; } }
async function pinHash(pin, salt, iter) {
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits']);
  return b64(await crypto.subtle.deriveBits({name:'PBKDF2', salt:b64d(salt), iterations:iter, hash:'SHA-256'}, k, 256));
}
async function pinSave(pin) {
  const salt = b64(crypto.getRandomValues(new Uint8Array(16))), iter = 150000;
  localStorage.setItem(PIN_KEY, JSON.stringify({salt, iter, hash:await pinHash(pin, salt, iter), len:pin.length}));
}
async function pinCheck(pin) { const r = pinRec(); return !!r && (await pinHash(pin, r.salt, r.iter)) === r.hash; }
const lockVerifying = () => L.mode === 'unlock' || L.mode === 'confirm' || (L.mode === 'change' && L.step === 0);
const lockNewStep = () => (L.mode === 'setup' && L.step === 0) || (L.mode === 'change' && L.step === 1);
function lockOpen(mode, opts) {
  L.mode = mode; L.step = 0; L.buf = ''; L.first = '';
  L.onOk = (opts && opts.onOk) || null; L.info = (opts && opts.info) || ''; L.cancellable = !!(opts && opts.cancellable); L.firstRun = !!(opts && opts.firstRun);
  closeSheet(); $('#dlg').classList.remove('open');
  document.body.classList.add('locked'); $('#lock').classList.remove('hidden'); lockDraw();
}
function lockClose() { L.mode = null; document.body.classList.remove('locked'); $('#lock').classList.add('hidden'); render(); }
function lockDraw(msg) {
  const m = L.mode, s = L.step;
  const [title, sub] = m === 'unlock' ? ['Wpisz PIN', ''] : m === 'confirm' ? ['Potwierdź PIN-em', L.info]
    : m === 'setup' ? (s === 0 ? ['Ustaw PIN', '4–6 cyfr. Będzie potrzebny przy każdym otwarciu aplikacji.'] : ['Powtórz PIN', ''])
    : (s === 0 ? ['Obecny PIN', ''] : s === 1 ? ['Nowy PIN', '4–6 cyfr'] : ['Powtórz nowy PIN', '']);
  $('#lockTitle').textContent = title; $('#lockSub').textContent = sub;
  const n = lockVerifying() ? (pinRec()?.len || 4) : (L.step === (m === 'setup' ? 1 : 2) ? L.first.length : Math.max(4, L.buf.length));
  $('#dots').innerHTML = Array.from({length:n}, (_, i) => `<i class="${i < L.buf.length ? 'f' : ''}"></i>`).join('');
  $('#lockMsg').textContent = msg || '';
  $('#padOk').classList.toggle('inv', !lockNewStep());
  $('#lockForgot').classList.toggle('hidden', m !== 'unlock');
  $('#lockCancel').classList.toggle('hidden', m !== 'change' && m !== 'confirm' && !L.cancellable);
  $('#lockCancel').textContent = (m === 'setup' && L.firstRun) ? 'Bez PIN-u' : 'Anuluj';
}
function lockShake() { const b = $('#lockbox'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); }
async function lockKey(k) {
  if (!L.mode || L.busy) return;
  if (Date.now() < L.until) { lockDraw(`Za dużo prób. Spróbuj za ${Math.ceil((L.until - Date.now()) / 1000)} s`); return; }
  if (k === 'del') { L.buf = L.buf.slice(0, -1); lockDraw(); return; }
  if (k === 'ok') { if (lockNewStep()) await lockSubmit(); return; }
  const target = lockVerifying() ? (pinRec()?.len || 4) : lockNewStep() ? 0 : L.first.length;
  if (L.buf.length >= (target || 6)) return;
  L.buf += k; lockDraw();
  if (target && L.buf.length === target) { L.busy = true; setTimeout(() => { L.busy = false; lockSubmit(); }, 100); }
}
async function lockSubmit() {
  const pin = L.buf;
  if (lockVerifying()) {
    L.busy = true; const m = $('#lockMsg'); m.textContent = 'Sprawdzam…'; m.classList.add('info');
    const ok = await pinCheck(pin); L.busy = false; m.classList.remove('info');
    if (!ok) { L.buf = ''; if (++L.fails >= 5) { L.until = Date.now() + 30000; L.fails = 0; } lockShake(); lockDraw('Błędny PIN'); return; }
    L.fails = 0;
    if (L.mode === 'unlock') { lockClose(); return; }
    if (L.mode === 'confirm') { const cb = L.onOk; lockClose(); if (cb) cb(); return; }
    L.step = 1; L.buf = ''; lockDraw(); return;
  }
  if (lockNewStep()) {
    if (pin.length < 4) { lockShake(); lockDraw('PIN musi mieć 4–6 cyfr'); return; }
    L.first = pin; L.step++; L.buf = ''; lockDraw(); return;
  }
  if (pin !== L.first) { L.step--; L.buf = ''; L.first = ''; lockShake(); lockDraw('PIN-y się różnią – spróbuj jeszcze raz'); return; }
  L.busy = true;
  try { await pinSave(pin); } catch (e) { L.busy = false; lockDraw('Nie udało się zapisać PIN-u'); return; }
  L.busy = false;
  const change = L.mode === 'change'; L.cancellable = false; try { localStorage.removeItem(PIN_OFF); } catch (e) {}
  lockClose(); toast(change ? 'PIN zmieniony' : 'PIN ustawiony'); if (S.tab === 'ustawienia') renderMain(true);
}
$('#pad').addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-k]'); if (!b) return;

document.addEventListener('keydown', e => {

});

$('#lockForgot').addEventListener('click', async () => {

/* ---------- actions ---------- */
function setMonth(k) { if (k === S.month) return; S.month = k; subMonth(); render(); }
const RO_OK = ['close','tab','mprev','mnext','mtoday','mjump','cat','wallet','edittx','theme','recon','togglecats'];

document.addEventListener('click', async e => {
  if (Date.now() - MS_T < 400) return;
  const swr = e.target.closest('.sw-row');
  if (swr && swr.dataset.swiped && Date.now() - Number(swr.dataset.swiped) < 400) return;
  if (swr && swr.classList.contains('open')) { swClose(); return; }
  const el = e.target.closest('[data-act]'); if (!el || L.mode) return;
  const a = el.dataset.act, ds = el.dataset;
  if (S.readOnly && !RO_OK.includes(a)) return;
  switch (a) {
    case 'close': closeSheet(); break;
    case 'tab':
      if (ds.tab === 'ustawienia' && S.tab !== 'ustawienia') { S.draft = null; S.draftDirty = false; }
      if (ds.tab === 'pomoc' && S.tab !== 'pomoc' && !REPORT) { S.tab = ds.tab; window.scrollTo(0, 0); render(); checkUpdate(); break; }
      S.tab = ds.tab; window.scrollTo(0, 0); render(); break;
    case 'mprev': setMonth(shiftMonth(S.month, -1)); break;
    case 'mnext': setMonth(shiftMonth(S.month, 1)); break;
    case 'mtoday': setMonth(REPORT ? (REPORT.month || CUR) : CUR); break;
    case 'theme': { lsSet('budzet-theme', isDarkNow() ? 'light' : 'dark'); applyTheme(); render(); if (S.tab === 'ustawienia') renderMain(true); break; }
    case 'settheme': lsSet('budzet-theme', ds.v); applyTheme(); render(); renderMain(true); break;
    case 'pinchange': lockOpen('change'); break;
    case 'pinoff':
      lockOpen('confirm', {info:'Wyłączenie PIN-u', onOk:() => { try { localStorage.removeItem(PIN_KEY); } catch (e) {} lsSet(PIN_OFF, '1'); toast('PIN wyłączony'); renderMain(true); }});
      break;
    case 'pinon': lockOpen('setup', {cancellable:true}); break;
    case 'updcheck': {
      S.remote = null; renderMain(true);
      await checkUpdate();
      toast(S.remote && !S.remote.error ? (verNewer(S.remote.version, APP_VERSION) ? `Jest nowa wersja ${S.remote.version}` : '✓ Masz aktualną wersję') : 'Nie udało się sprawdzić – brak internetu?');
      break;
    }
    case 'clearmonth': {
      const m = S.month, n = S.tx.length;
      const ch = await choose(`Wyczyścić ${monthLabel(m)}? Tego nie da się cofnąć – jeśli chcesz mieć kopię, najpierw wyślij raport.`,
        [{label:`Usuń operacje (${n}) – zostaw plan i środki`, cls:'danger'}, {label:(m <= shiftMonth(CUR, AHEAD)) ? 'Wyczyść cały miesiąc i utwórz od nowa' : 'Usuń cały miesiąc', cls:'danger'}]);
      if (ch < 0) return;
      const whole = ch === 1;
      const run = async () => {
        const removed = await store.clearMonth(m, whole);
        let re = 0; if (whole) re = await ensureAhead(true);
        toast(whole ? (re ? `${monthLabel(m)} utworzony od nowa` : `Usunięto ${monthLabel(m)}`) : `Usunięto ${removed} operacji`);
        S.tab = 'budzet'; render();
      };
      if (pinSupported() && pinRec()) lockOpen('confirm', {info:(whole ? 'Usunięcie całego miesiąca: ' : 'Usunięcie operacji: ') + monthLabel(m), onOk:run});
      else if (await ask('Na pewno?', 'Tak, usuń')) run();
      break;
    }
    case 'update': doUpdate(); break;

    case 'report': sendReport(); break;
    case 'xlsx': exportXlsx(); break;
    case 'import': $('#importFile').value = ''; $('#importFile').click(); break;

    case 'obgo': {
      const names = [$('#ob-w1').value.trim(), $('#ob-w2').value.trim()].filter(Boolean);
      const wallets = (names.length ? names : ['Ja']).map(n => ({id:uid(), name:n}));
      const categories = DEFAULT_CATS.filter((c, i) => $('#ob-c' + i)?.checked).map(c => Object.assign({id:uid()}, c));
      await write(store.saveSettings({wallets, categories}));
      break;
    }
    case 'newmonth': openNewMonth(); break;
    case 'nmcreate': {
      const start = {}, adj = {}, carry = S.sheet.carry;
      for (const inp of document.querySelectorAll('[data-nw]')) {
        const v = parseZl(inp.value), w = inp.dataset.nw; if (isNaN(v)) { toast('Popraw kwotę dla: ' + walletName(w)); return; }
        if (carry) { const d = v - (carry[w] || 0); if (d) adj[w] = d; } else if (v) start[w] = v;
      }
      const copy = $('#nmcopy')?.checked;
      const plan = {};
      if (copy) for (const [k, v] of Object.entries(S.sheet.plan || {})) if (catById(k) && v) plan[k] = v;
      const m = S.month; closeSheet();
      const doc = carry ? {carry:true, adj, plan, created:Date.now()} : {carry:false, start, plan, created:Date.now()};
      if (await write(store.saveMonth(m, doc))) {
        const n = await applyRules(m, pendingRulesFor(m));
        const made = await ensureAhead(true);
        toast(made ? `Budżet utworzony · gotowe także ${made} kolejnych miesięcy` : n ? `Budżet utworzony · dodano ${n} zaplanowane` : 'Budżet utworzony');
      }
      break;
    }

    case 'cat': openCat(ds.id); break;
    case 'recon': openRecon(); break;
    case 'cover': await coverDeficit(); break;
    case 'refmail': {
      const to = ($('#refmail') || {}).value ? $('#refmail').value.trim() : '';
      if (to && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to)) { toast('Sprawdź adres e-mail'); return; }
      location.href = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(refSubject)}&body=${encodeURIComponent(refText())}`;
      break;
    }
    case 'refshare': {
      if (navigator.share) { try { await navigator.share({title:refSubject, text:refText()}); } catch (e) {} }
      else { try { await navigator.clipboard.writeText(refText()); toast('Skopiowano wiadomość – wklej ją w komunikatorze'); } catch (e) { toast('Nie udało się udostępnić'); } }
      break;
    }
    case 'refcopy': try { await navigator.clipboard.writeText(appUrl()); toast('Link skopiowany'); } catch (e) { toast(appUrl()); } break;
    case 'swdel': { swClose(); const t = S.tx.find(x => x.id === ds.id); if (t) await quickDeleteTx(t); break; }
    case 'swmov': { swClose(); const t = S.tx.find(x => x.id === ds.id); if (t) await moveTxFlow(t); break; }
    case 'swlim': { swClose(); await quickDeleteLimit(ds.id); break; }
    case 'sworph': { swClose(); await fixOrphan(ds.id); break; }
    case 'togglecats': S.showAllCats = !S.showAllCats; render(); break;
    case 'addlimit': {
      const c = calc();
      const free = S.settings.categories.filter(x => !(c.C[x.id] && c.C[x.id].manual));
      const ch = await choose('Dla której kategorii ustawić limit na ' + monthLabel(S.month) + '?', [...free.map(x => ({label:(x.emoji || '') + ' ' + x.name})), {label:'+ Nowa kategoria (dodasz ją w Ustawieniach)'}]);
      if (ch < 0) return;
      if (ch === free.length) { S.tab = 'ustawienia'; S.draft = null; render(); toast('Dodaj kategorię i zapisz, potem ustaw jej limit'); return; }
      openCat(free[ch].id); setTimeout(() => { const p = $('#plan'); if (p) p.focus(); }, 250);
      break;
    }
    case 'orphfix': { const id = ds.id; closeSheet(); await fixOrphan(id); break; }
    case 'planmatch': $('#plan').value = toInput(Number(ds.v)); updatePlanHint(); break;
    case 'planfill': { const s = S.sheet; $('#plan').value = toInput(Math.max(s.spent || 0, s.basePlan + s.baseAssign)); updatePlanHint(); break; }
    case 'plansave': {
      const v = parseZl($('#plan').value); if (isNaN(v) || v < 0) { toast('Wpisz poprawną kwotę'); return; }
      const cid = S.sheet.id, m = S.month, fut = futureMonthsOf(m);
      let targets = [m];
      if (fut.length && v !== (S.sheet.auto ? 0 : S.sheet.basePlan)) {
        const futY = fut.filter(k => k.slice(5) === m.slice(5));
        const opts = [{label:`Tylko ${monthLabel(m)}`}];
        if (futY.length) opts.push({label:`Tu i co rok w ${MONTH_LOC[m.slice(5)]}`});
        opts.push({label:`${monthLabel(m)} i wszystkie kolejne (${fut.length})`});
        const ch = await choose(`Zmienić plan „${catName(cid)}” na ${zl(v)}:`, opts);
        if (ch < 0) return;
        if (ch === opts.length - 1 && ch > 0) targets = [m, ...fut];
        else if (ch === 1 && futY.length) targets = [m, ...futY];
      }
      closeSheet();
      await write(store.batch(async () => { for (const k of targets) { const md = clone(S.data.months[k]); md.plan = md.plan || {}; if (v) md.plan[cid] = v; else delete md.plan[cid]; await store.saveMonth(k, md); } }),
        targets.length > 1 ? `Plan zapisany w ${targets.length} miesiącach` : 'Plan zapisany');
      break;
    }

    case 'catemo': { const c = catById(ds.id); if (c) openEmoPicker(c.name, c.emoji, {kind:'emo', direct:ds.id}); break; }
    case 'wallet': openWallet(ds.id); break;
    case 'mjump': setMonth(ds.m); break;
    case 'asset': openAsset(ds.id); break;
    case 'assetadd': openAsset(null); break;
    case 'akind': syncAsset(); S.adraft.kind = ds.v; renderAssetSheet(); break;
    case 'aremind': syncAsset(); S.adraft.remind = Number(ds.v); renderAssetSheet(); break;
    case 'asave': case 'arenew': case 'adel': await assetAction(a); break;
    case 'adj': applyAdj(ds.t, Number(ds.v)); break;
    case 'wadj': {
      const d = parseZl($('#wdelta').value), cur = parseZl($('#wstart').value);
      if (isNaN(d) || d <= 0) { toast('Wpisz kwotę, o którą zmienić stan'); return; }
      if (isNaN(cur)) { toast('Popraw kwotę środków na start'); return; }
      const nv = cur + Number(ds.v) * d;
      $('#wstart').value = nv === 0 ? '0,00' : toInput(nv);
      $('[data-act="wsave"]').click();
      break;
    }
    case 'wsave': {
      const v = parseZl($('#wstart').value); if (isNaN(v)) { toast('Wpisz poprawną kwotę'); return; }
      const md = clone(S.monthDoc), w = S.sheet.id, carried = S.sheet.carried;
      if (carried !== null && carried !== undefined) { md.carry = true; md.adj = md.adj || {}; const d = v - carried; if (d) md.adj[w] = d; else delete md.adj[w]; }
      else { md.start = md.start || {}; if (v) md.start[w] = v; else delete md.start[w]; if (md.carry === undefined) md.carry = false; }
      const m = S.month; closeSheet();
      await write(store.saveMonth(m, md), 'Zapisano');
      break;
    }

    case 'paid': { const t = S.tx.find(x => x.id === ds.id); if (!t) return; const n = clone(t); delete n.planned; n.wasPlanned = true; n.mt = Date.now(); await write(store.saveTx(n), t.type === 'wplyw' ? 'Oznaczono jako wpłynięte' : 'Oznaczono jako zapłacone'); break; }

    case 'addtx':
      if (!S.settings.wallets.length) { toast('Najpierw dodaj konto w Ustawieniach'); return; }
      openTx({cat:ds.cat, type:ds.type, wallet:ds.wallet}); break;
    case 'edittx': {
      let t = S.tx.find(x => x.id === ds.id);
      if (!t && store.allTx) { t = store.allTx().find(x => x.id === ds.id); if (t) { setMonth(t.m); t = S.tx.find(x => x.id === ds.id); } }
      if (t && !S.readOnly) openTx({edit:t}); break;
    }
    case 'ttype': syncTxInputs(); S.txDraft.type = ds.v;
      if (ds.v === 'przelew' && (!S.txDraft.to || S.txDraft.to === S.txDraft.wallet)) S.txDraft.to = S.settings.wallets.find(w => w.id !== S.txDraft.wallet)?.id || null;
      renderTxSheet(false); break;
    case 'pick': syncTxInputs(); S.txDraft[ds.f] = ds.v;
      if (ds.f === 'wallet' && S.txDraft.type === 'przelew' && S.txDraft.to === ds.v) S.txDraft.to = S.settings.wallets.find(w => w.id !== ds.v)?.id || null;
      renderTxSheet(false); break;
    case 'tnewcat': syncTxInputs(); S.txDraft.newCat = {name:'', group:'zmienne'}; renderTxSheet(false); setTimeout(() => { const n = $('#ncname'); if (n) { n.focus(); n.scrollIntoView({block:'center'}); } }, 60); break;
    case 'tncgroup': syncTxInputs(); { const n = $('#ncname'); if (n) S.txDraft.newCat.name = n.value; } S.txDraft.newCat.group = ds.v; renderTxSheet(false); break;
    case 'tnccancel': syncTxInputs(); delete S.txDraft.newCat; renderTxSheet(false); break;
    case 'tncadd': {
      syncTxInputs();
      const nc = S.txDraft.newCat, name = (($('#ncname') || {}).value || '').trim();
      if (!name) { toast('Wpisz nazwę kategorii'); return; }
      if (S.settings.categories.some(c => c.name.toLowerCase() === name.toLowerCase())) { toast('Taka kategoria już jest'); return; }
      const cat = {id:uid(), emoji:guessIcon(name) || '🏷️', name, group:nc.group || 'zmienne'};
      const st = clone(S.settings); st.categories.push(cat);
      if (!(await write(store.saveSettings(st)))) return;
      if (S.draft) S.draft.categories.push(clone(cat));
      delete S.txDraft.newCat; S.txDraft.cat = cat.id;
      renderTxSheet(false); toast(`Dodano kategorię ${cat.emoji} ${name}`);
      break;
    }
    case 'tplanned': syncTxInputs(); S.txDraft.planned = !S.txDraft.planned; renderTxSheet(false); break;
    case 'trepeat': syncTxInputs(); S.txDraft.repeat = ds.v; if (ds.v !== 'none' && !S.txDraft.id) S.txDraft.planned = S.txDraft.planned; renderTxSheet(false); break;
    case 'tsave': {
      syncTxInputs(); const err = validateDraft(); if (err) { toast(err); return; }
      const t = S.txDraft, rec = recFromDraft();
      const orig = t.id ? S.tx.find(z => z.id === t.id) : null;
      const oldRule = t.rule && S.rules[t.rule] ? S.rules[t.rule] : null;
      const futureOf = r => store.allTx().filter(x => x.rule === r.id && x.m > S.month && x.planned);
      let newRule = null, scopeAll = false, scopeYear = false, msg = !t.id ? 'Dodano' : 'Zapisano';
      if (oldRule && t.repeat === ruleKey(oldRule) && orig) {
        const changed = ['amount','cat','wallet','to','note','type'].some(k => (orig[k] || '') !== (rec[k] || '')) || orig.d.slice(8) !== rec.d.slice(8);
        if (changed) {
          const ch = await choose('Ta pozycja powtarza się ' + freqLabel(oldRule) + '. Zmienić:', [{label:`Tylko w: ${monthLabel(S.month)}`}, {label:`Tu i co rok w ${MONTH_LOC[S.month.slice(5)]}`}, {label:'W tym i wszystkich kolejnych miesiącach'}]);
          if (ch < 0) return;
          scopeAll = ch === 2; scopeYear = ch === 1;
        }
      }
      lsSet('budzet-lastWallet', t.wallet);
      closeSheet();
      const ok = await write(store.batch(async () => {
        if (oldRule) {
          if (t.repeat === 'none') {
            for (const x of futureOf(oldRule)) await store.deleteTx(x.id);
            await store.deleteRule(oldRule.id); msg = 'Zapisano · powtarzanie wyłączone';
          } else if (t.repeat !== ruleKey(oldRule)) {
            const upd = ruleFromTx(rec, t.repeat, {id:oldRule.id, from:oldRule.from});
            for (const x of futureOf(oldRule)) if (!ruleApplies(upd, x.m)) await store.deleteTx(x.id);
            await store.saveRule(upd); rec.rule = oldRule.id; newRule = upd;
          } else {
            rec.rule = oldRule.id;
            const changedNow = orig && (['amount','cat','wallet','to','note','type'].some(k => (orig[k] || '') !== (rec[k] || '')) || orig.d.slice(8) !== rec.d.slice(8));
            if (scopeAll) delete rec.override; else if (changedNow) rec.override = true; else if (orig && orig.override) rec.override = true;
            if (scopeYear) {
              let n = 0; const ms = [];
              for (const x of futureOf(oldRule)) {
                if (x.m.slice(5) !== S.month.slice(5)) continue;
                ms.push(x.m);
                const y = Object.assign({}, x, {type:rec.type, amount:rec.amount, wallet:rec.wallet, note:rec.note, d:clampDay(x.m, Number(rec.d.slice(8))), override:true});
                delete y.cat; delete y.to; if (rec.type === 'wydatek') y.cat = rec.cat; if (rec.type === 'przelew') y.to = rec.to;
                await store.saveTx(y); n++;
              }
              msg = n ? `Zapisano tu i w: ${ms.map(monthLabel).join(', ')}` : 'Zapisano – przejdzie też na ten miesiąc w kolejnym roku';
            }
            if (scopeAll) {
              const upd = ruleFromTx(rec, t.repeat, {id:oldRule.id, from:oldRule.from});
              await store.saveRule(upd);
              let n = 0;
              for (const x of futureOf(oldRule)) {
                const y = Object.assign({}, x, {type:rec.type, amount:rec.amount, wallet:rec.wallet, note:rec.note, d:clampDay(x.m, upd.day)});
                delete y.cat; delete y.to; delete y.override; if (rec.type === 'wydatek') y.cat = rec.cat; if (rec.type === 'przelew') y.to = rec.to;
                await store.saveTx(y); n++;
              }
              msg = n ? `Zapisano tu i w ${n} kolejnych miesiącach` : 'Zapisano (także dla kolejnych miesięcy)';
            }
          }
        } else if (t.repeat !== 'none') {
          newRule = ruleFromTx(rec, t.repeat); await store.saveRule(newRule); rec.rule = newRule.id;
        }
        const cvc = rec.cat && calc().C[rec.cat];
        const cov = !t.id && !rec.planned && rec.type === 'wydatek' && !(cvc && cvc.manual) && t.cover ? S.tx.find(z => z.id === t.cover && z.planned) : null;
        if (cov) {
          const n = clone(cov), cut = Math.min(rec.amount, n.amount), ci = txInfo(cov);
          n.amount -= cut; n.mt = Date.now(); if (n.rule) n.override = true;
          if (n.amount > 0) await store.saveTx(n); else await store.deleteTx(n.id);
          msg = `Dodano · zdjęto ${zl(cut)} z „${ci.title}${cov.note ? ' · ' + cov.note : ''}”`;
        }
        await store.saveTx(rec);
      }), null);
      if (!ok) break;
      if (newRule) {
        let added = [];
        await store.batch(async () => { added = await applyRuleToExisting(newRule); });
        toast(added.length ? `${msg} · dodano też do ${added.length} ${added.length === 1 ? 'miesiąca' : 'miesięcy'}` : msg);
      } else toast(msg);
      break;
    }
    case 'tcopy': {
      syncTxInputs(); const err = validateDraft(); if (err) { toast(err); return; }
      const rec = recFromDraft(), target = shiftMonth(S.month, Number(ds.v));
      const r = ruleFromTx(rec, 'once', {target});
      await store.saveRule(r);
      const added = await applyRuleToExisting(r);
      closeSheet();
      toast(added.length ? `Dodano jako zaplanowaną: ${monthLabel(target)}` : `Pojawi się po utworzeniu budżetu na ${monthLabel(target)}`);
      break;
    }
    case 'tdel': { const t = S.tx.find(x => x.id === S.txDraft.id); if (t) await deleteTxFlow(t); break; }
    case 'rdel': {
      const r = S.rules[ds.id]; if (!r) return;
      const fut = store.allTx().filter(x => x.rule === r.id && x.m > CUR && x.planned);
      const ch = await choose(`Usunąć „${ruleTitle(r)}” (${ruleWhen(r)})?`, fut.length
        ? [{label:'Usuń powtarzanie – zostaw już dodane', cls:'danger'}, {label:`Usuń też zaplanowane w przyszłych miesiącach (${fut.length})`, cls:'danger'}]
        : [{label:'Usuń', cls:'danger'}]);
      if (ch < 0) return;
      await write(store.batch(async () => { if (ch === 1) for (const x of fut) await store.deleteTx(x.id); await store.deleteRule(r.id); }), 'Usunięto'); renderMain(true);
      break;
    }

    /* settings */
    case 'wadd': S.draft.wallets.push({id:uid(), name:''}); S.draftDirty = true; renderMain(true); break;
    case 'wdel': {
      const w = S.draft.wallets[+ds.i];
      if (S.draft.wallets.length <= 1) { toast('Musi zostać przynajmniej jedno konto'); return; }
      if (!(await ask(`Usunąć konto „${w.name || 'bez nazwy'}”? Operacje zostaną w historii.`))) return;
      S.draft.wallets.splice(+ds.i, 1); S.draftDirty = true; renderMain(true); break;
    }
    case 'cadd': S.draft.categories.push({id:uid(), emoji:'🏷️', name:'', group:'zmienne', autoIcon:true}); S.draftDirty = true; renderMain(true);
      setTimeout(() => { const ins = document.querySelectorAll('[data-in="cname"]'); const last = ins[ins.length - 1]; if (last) last.focus(); }, 50); break;
    case 'cautoicons': {
      let n = 0;
      for (const c of S.draft.categories) { const g = guessIcon(c.name); if (g && g !== c.emoji) { c.emoji = g; n++; } }
      S.draftDirty = n > 0 || S.draftDirty; renderMain(true);
      toast(n ? `Zmieniono ikony: ${n} – pamiętaj „Zapisz zmiany”` : 'Ikony już pasują albo nie znalazłem dopasowań');
      break;
    }
    case 'cemopick': { const i = +ds.i, c = S.draft.categories[i]; openEmoPicker(c.name, c.emoji, {kind:'emo', i}); break; }
    case 'cemoset': {
      const sh = S.sheet; if (!sh || sh.kind !== 'emo') return;
      const v = ds.v || ($('#emocustom') ? $('#emocustom').value.trim() : '');
      if (!v) { toast('Wpisz emoji'); return; }
      if (sh.direct) {
        const st = clone(S.settings), c = st.categories.find(x => x.id === sh.direct); if (!c) return;
        c.emoji = v; closeSheet(); await write(store.saveSettings(st), 'Ikona zmieniona');
        if (S.draft) { const dc = S.draft.categories.find(x => x.id === sh.direct); if (dc) dc.emoji = v; }
        break;
      }
      const c = S.draft.categories[sh.i]; c.emoji = v; c.autoIcon = false; S.draftDirty = true;
      closeSheet(); renderMain(true);
      break;
    }
    case 'cdel': {
      const c = S.draft.categories[+ds.i];
      const saved = S.settings.categories.some(x => x.id === c.id);
      if (!saved) { S.draft.categories.splice(+ds.i, 1); renderMain(true); break; }
      const r = await categoryCleanup(c.id, c.name || 'bez nazwy');
      if (r === 'cancel') return;
      if (r === 'none') {
        if (!(await ask(`Usunąć kategorię „${c.name || 'bez nazwy'}”?`))) return;
        await write(reassignCategory(c.id, null));
      }
      toast(r.startsWith('moved:') ? `Przeniesiono do „${r.slice(6)}” i usunięto kategorię` : 'Kategoria usunięta');
      renderMain(true); break;
    }
    case 'cup': case 'cdown': {
      const i = +ds.i, j = a === 'cup' ? i - 1 : i + 1, arr = S.draft.categories;
      if (j < 0 || j >= arr.length) return;
      [arr[i], arr[j]] = [arr[j], arr[i]]; S.draftDirty = true; renderMain(true); break;
    }
    case 'ssave': {
      const d = clone(S.draft);
      d.wallets.forEach(w => w.name = w.name.trim()); d.categories.forEach(c => { c.name = c.name.trim(); c.emoji = (c.emoji || '').trim() || '🏷️'; delete c.autoIcon; });
      if (d.wallets.some(w => !w.name) || d.categories.some(c => !c.name)) { toast('Uzupełnij wszystkie nazwy'); return; }
      if (d.colors) {
        const lo = typeof d.colors.low === 'string' ? parseZl(d.colors.low) : d.colors.low, mi = typeof d.colors.mid === 'string' ? parseZl(d.colors.mid) : d.colors.mid;
        if ([lo, mi].some(v => v === undefined || isNaN(v)) || lo >= mi) { toast('Progi kolorów: pierwszy musi być mniejszy od drugiego'); return; }
        d.colors = {low:lo, mid:mi};
      }
      if (await write(store.saveSettings(d), 'Zapisano ustawienia')) { S.draft = d; S.draftDirty = false; renderMain(true); }
      break;
    }
  }
});

$('#importFile').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) importFile(f); });
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'plan') { updatePlanHint(); return; }
  if (el.id === 'histq') { S.histQ = el.value; const r = $('#histres'); if (r) r.innerHTML = historyList(); return; }
  if (el.id === 'ncname') { if (S.txDraft && S.txDraft.newCat) S.txDraft.newCat.name = el.value; const i = $('#ncicon'); if (i) i.textContent = guessIcon(el.value) || '🏷️'; return; }
  const k = el.dataset && el.dataset.in; if (!k || !S.draft) return;
  const i = +el.dataset.i;
  if (k === 'wname') S.draft.wallets[i].name = el.value;
  else if (k === 'cname') {
    const c = S.draft.categories[i]; c.name = el.value;
    if (c.autoIcon || !c.emoji || c.emoji === '🏷️') {
      const g = guessIcon(el.value);
      c.emoji = g || '🏷️'; c.autoIcon = true;
      const b = el.parentElement && el.parentElement.querySelector('.emobtn'); if (b) b.textContent = c.emoji;
    }
  }
  else if (k === 'cemoji') S.draft.categories[i].emoji = el.value;
  else if (k === 'cgroup') S.draft.categories[i].group = el.value;
  else if (k === 'colLow' || k === 'colMid') { S.draft.colors = S.draft.colors || {}; S.draft.colors[k === 'colLow' ? 'low' : 'mid'] = el.value; }
  if (!S.draftDirty) { S.draftDirty = true; const b = document.querySelector('[data-act="ssave"]'); if (b) b.textContent = 'Zapisz zmiany •'; }
});
document.addEventListener('change', e => { if (e.target.matches('select[data-in]')) e.target.dispatchEvent(new Event('input', {bubbles:true})); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'tamt') { e.preventDefault(); e.target.blur(); } });

/* ---------- start ---------- */
store = REPORT ? LocalStore(REPORT, false) : LocalStore(null, true);
subAll(); render();

ensureAhead();
document.addEventListener('visibilitychange', () => { if (!document.hidden) ensureAhead(); });
if (REPORT || !pinSupported()) { $('#lock').classList.add('hidden'); document.body.classList.remove('locked'); }
else if (pinRec()) lockOpen('unlock');
else if (lsGet(PIN_OFF) === '1') { $('#lock').classList.add('hidden'); document.body.classList.remove('locked'); }
else lockOpen('setup', {cancellable:true, firstRun:true});

if (!REPORT && location.protocol.startsWith('http')) {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  setTimeout(() => loadXlsx().catch(() => {}), 3000);
  let lastUpdCheck = 0;
  const autoCheck = () => { if (navigator.onLine !== false && Date.now() - lastUpdCheck > 30 * 60e3) { lastUpdCheck = Date.now(); checkUpdate(); } };
  setTimeout(autoCheck, 5000);
  // także po powrocie do aplikacji (najwyżej co 30 minut)
  document.addEventListener('visibilitychange', () => { if (!document.hidden) autoCheck(); });
}
</script>
</body>
</html>
